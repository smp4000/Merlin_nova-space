<style>
#merlin-demo{--m-ink:#102b4c;--m-muted:#567084;--m-accent:#00869a;--m-soft:#e6f5fa;--m-line:#dce7ef;--m-bg:#f2f8fc;--m-paper:#fff;--m-warning:#925500;--m-danger:#b33b36;--m-radius:14px;color-scheme:light;font:14px/1.5 'Segoe UI',Arial,sans-serif;color:var(--m-ink);position:relative;isolation:isolate}
#merlin-demo *{box-sizing:border-box}
#merlin-demo [hidden]{display:none!important}
#merlin-demo button,#merlin-demo input,#merlin-demo select{font:inherit}
#merlin-demo button{cursor:var(--cursor-interaction,pointer)}
#merlin-demo button:focus-visible,#merlin-demo input:focus-visible,#merlin-demo select:focus-visible{outline:3px solid #68bfce;outline-offset:3px}
#merlin-demo button:disabled{opacity:.5;cursor:not-allowed}
#merlin-demo h1,#merlin-demo h2,#merlin-demo h3,#merlin-demo p{margin:0}
#merlin-demo h1{font-size:29px;line-height:1.18;letter-spacing:-1px;font-weight:700}
#merlin-demo h2{font-size:17px;letter-spacing:-.35px;font-weight:650}
#merlin-demo h3{font-size:14px;font-weight:650}
#merlin-demo .m-muted{color:var(--m-muted)}
#merlin-demo .m-small{font-size:12px}
#merlin-demo .m-number{font-variant-numeric:tabular-nums}
#merlin-demo .m-demo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding-right:100px;font-size:12px;color:var(--m-muted)}
#merlin-demo .m-demo button{border:0;background:transparent;color:var(--m-accent);padding:6px;text-decoration:underline;text-underline-offset:3px}
#merlin-demo .m-shell{display:grid;grid-template-columns:185px minmax(0,1fr);background:var(--m-bg);border:1px solid var(--m-line);border-radius:18px;min-height:730px;overflow:clip;box-shadow:0 12px 40px #143b5910}
#merlin-demo .m-side{background:var(--m-paper);border-right:1px solid var(--m-line);padding:23px 12px 16px;display:flex;flex-direction:column;gap:24px;min-width:0}
#merlin-demo .m-logo{display:flex;align-items:center;gap:9px;padding:0 10px;font-size:27px;letter-spacing:-1.3px;font-weight:750}
#merlin-demo .m-mark{width:23px;height:26px;background:var(--m-accent);clip-path:polygon(0 18%,50% 0,100% 18%,100% 77%,50% 100%,0 77%,0 49%,50% 72%,75% 62%,50% 49%,0 74%)}
#merlin-demo .m-org{padding:0 10px;display:grid;gap:4px;font-size:12px}
#merlin-demo .m-org strong{font-size:13px}
#merlin-demo .m-nav{display:grid;gap:5px}
#merlin-demo .m-nav button{border:0;background:transparent;color:var(--m-muted);display:flex;gap:11px;align-items:center;text-align:left;padding:11px;border-radius:9px;min-width:0;font-size:12px}
#merlin-demo .m-nav button[aria-current=page]{color:var(--m-accent);background:var(--m-soft);font-weight:650}
#merlin-demo .m-nav button:hover{background:var(--m-bg)}
#merlin-demo .m-nav svg{width:17px;height:17px;flex:none}
#merlin-demo .m-side-foot{margin-top:auto;border-top:1px solid var(--m-line);padding-top:14px}
#merlin-demo .m-main{min-width:0}
#merlin-demo .m-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--m-paper);padding:14px 23px;border-bottom:1px solid var(--m-line)}
#merlin-demo .m-top label{display:flex;align-items:center;gap:8px;font-size:12px}
#merlin-demo select{border:1px solid var(--m-line);border-radius:8px;padding:7px 25px 7px 9px;color:var(--m-ink);background:var(--m-paper);max-width:100%}
#merlin-demo .m-avatar{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:50%;background:var(--m-soft);color:var(--m-accent);font-size:11px;font-weight:650;flex:none}
#merlin-demo .m-top-right{display:flex;gap:12px;align-items:center}
#merlin-demo .m-content{padding:26px 24px;display:grid;gap:20px}
#merlin-demo .m-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
#merlin-demo .m-heading p{margin-top:9px;color:var(--m-muted);font-size:13px}
#merlin-demo .m-eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--m-accent);font-weight:650;margin-bottom:8px}
#merlin-demo .m-button{display:inline-flex;justify-content:center;align-items:center;gap:7px;border:1px solid var(--m-line);background:var(--m-paper);color:var(--m-ink);border-radius:8px;padding:9px 13px;font-size:12px;font-weight:600;text-decoration:none;min-height:36px}
#merlin-demo .m-button:hover{background:var(--m-soft)}
#merlin-demo .m-primary{background:var(--m-accent);border-color:var(--m-accent);color:#fff;box-shadow:0 3px 8px #00869a17}
#merlin-demo .m-primary:hover{background:#006b7c}
#merlin-demo .m-link{border:0;background:transparent;color:var(--m-accent);padding:5px 0;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;text-align:left}
#merlin-demo .m-button svg,#merlin-demo .m-link svg{width:15px;height:15px}
#merlin-demo .m-trial{display:flex;gap:13px;align-items:center;padding:13px 16px;background:var(--m-paper);border:1px solid var(--m-line);border-radius:var(--m-radius);flex-wrap:wrap;font-size:12px}
#merlin-demo .m-trial .m-link{margin-left:auto}
#merlin-demo .m-icon{display:inline-grid;place-items:center;width:33px;height:33px;background:var(--m-soft);border-radius:10px;color:var(--m-accent);flex:none}
#merlin-demo .m-icon svg{width:18px;height:18px}
#merlin-demo .m-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#merlin-demo .m-stat{background:var(--m-paper);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:16px;display:flex;align-items:flex-start;gap:11px}
#merlin-demo .m-stat strong{display:block;font-size:25px;line-height:1.1;letter-spacing:-.5px}
#merlin-demo .m-stat span.m-muted{font-size:11px;display:block;margin-top:6px}
#merlin-demo .m-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
#merlin-demo .m-panel{background:var(--m-paper);border:1px solid var(--m-line);border-radius:var(--m-radius);min-width:0;overflow:clip}
#merlin-demo .m-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 12px;flex-wrap:wrap}
#merlin-demo .m-panel-body{padding:0 18px 18px}
#merlin-demo .m-row{display:flex;gap:11px;align-items:center;padding:14px 0;border-top:1px solid var(--m-line);flex-wrap:wrap}
#merlin-demo .m-row:first-child{border-top:0}
#merlin-demo .m-row-main{flex:1;min-width:115px}
#merlin-demo .m-row-main strong{display:block;font-size:13px}
#merlin-demo .m-row-main .m-muted{display:block;font-size:11px;margin-top:3px}
#merlin-demo .m-badge{display:inline-block;border-radius:30px;padding:4px 8px;font-size:10px;white-space:nowrap;background:var(--m-soft);color:#006d7d;font-weight:600}
#merlin-demo .m-badge-warn{background:#fff2db;color:var(--m-warning)}
#merlin-demo .m-badge-neutral{background:#eef2f5;color:#526777}
#merlin-demo .m-station-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
#merlin-demo .m-station{background:var(--m-paper);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:18px;display:grid;gap:14px}
#merlin-demo .m-station-heading{display:flex;align-items:center;gap:10px}
#merlin-demo .m-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:12px;border-top:1px solid var(--m-line);font-size:11px}
#merlin-demo .m-mini-grid strong{display:block;font-size:17px;margin-top:3px}
#merlin-demo .m-stack{display:grid;gap:16px}
#merlin-demo .m-callout{background:var(--m-soft);padding:16px;border-radius:var(--m-radius);font-size:12px;display:grid;gap:8px}
#merlin-demo .m-week{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#merlin-demo .m-day{display:grid;gap:10px;align-content:start}
#merlin-demo .m-shift{border:1px solid var(--m-line);border-radius:10px;padding:13px;display:grid;gap:8px;background:var(--m-paper)}
#merlin-demo .m-shift[data-open=true]{border:1px dashed #80bdcb;background:#f2fbfd}
#merlin-demo .m-shift-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px}
#merlin-demo .m-table-wrap{overflow-x:auto}
#merlin-demo table{border-collapse:collapse;width:100%;text-align:left;font-size:12px}
#merlin-demo th{font-size:10px;letter-spacing:.25px;color:var(--m-muted);font-weight:650;padding:13px 16px;background:#f7fafc}
#merlin-demo td{padding:14px 16px;border-top:1px solid var(--m-line);vertical-align:middle}
#merlin-demo .m-person{display:flex;gap:9px;align-items:center;min-width:125px}
#merlin-demo .m-person strong{font-size:12px;display:block}
#merlin-demo .m-person small{display:block;color:var(--m-muted);font-size:10px;margin-top:2px}
#merlin-demo .m-empty{padding:24px 18px;color:var(--m-muted);font-size:13px}
#merlin-demo .m-footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--m-muted);font-size:10px;padding-top:4px}
#merlin-demo .m-layer{position:absolute;inset:30px 0 0;z-index:20;background:#17384e55;padding:55px 20px 25px;display:flex;justify-content:center;align-items:flex-start;border-radius:18px;backdrop-filter:blur(2px)}
#merlin-demo .m-dialog{background:var(--m-paper);border:1px solid var(--m-line);border-radius:18px;width:100%;max-width:510px;padding:25px;box-shadow:0 20px 70px #122d4930;display:grid;gap:17px}
#merlin-demo .m-dialog-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
#merlin-demo .m-dialog h2{font-size:21px}
#merlin-demo .m-dialog form{display:grid;gap:14px}
#merlin-demo .m-field{display:grid;gap:6px;font-size:12px}
#merlin-demo .m-field input,#merlin-demo .m-field select{width:100%;padding:10px;border:1px solid var(--m-line);border-radius:8px;background:var(--m-paper);color:var(--m-ink);min-height:40px}
#merlin-demo .m-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;padding-top:8px}
#merlin-demo .m-error{color:var(--m-danger);font-size:12px;min-height:0}
#merlin-demo .m-facts{display:grid;gap:12px}
#merlin-demo .m-fact{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--m-line);padding-bottom:10px;font-size:12px}
#merlin-demo .m-fact span:first-child{color:var(--m-muted)}
#merlin-demo .m-toast{margin-top:12px;padding:12px 16px;background:var(--m-soft);color:var(--m-ink);border-radius:10px;font-size:12px}
#merlin-demo .m-toast:empty{display:none}
#merlin-demo[data-compact=true] .m-content{gap:14px;padding:20px}
#merlin-demo[data-compact=true] .m-row{padding:10px 0}
@media(max-width:800px){#merlin-demo .m-shell{grid-template-columns:155px minmax(0,1fr)}#merlin-demo .m-content{padding:22px 16px}#merlin-demo .m-top{padding:12px 16px}#merlin-demo .m-layout{grid-template-columns:1fr}#merlin-demo h1{font-size:25px}#merlin-demo .m-stat{padding:12px;gap:8px}#merlin-demo .m-stat .m-icon{display:none}}
@media(max-width:590px){#merlin-demo .m-shell{grid-template-columns:1fr}#merlin-demo .m-side{border-right:0;border-bottom:1px solid var(--m-line);padding:16px;gap:14px}#merlin-demo .m-logo{padding:0}#merlin-demo .m-org{padding:0}#merlin-demo .m-nav{display:flex;flex-wrap:wrap;gap:4px}#merlin-demo .m-nav button{padding:8px;font-size:11px}#merlin-demo .m-nav svg{display:none}#merlin-demo .m-side-foot{padding:0;border:0;margin:0}#merlin-demo .m-side-foot .m-nav{display:flex}#merlin-demo h1{font-size:25px}#merlin-demo .m-station-grid,#merlin-demo .m-week{grid-template-columns:1fr}#merlin-demo .m-top-right .m-avatar{display:none}#merlin-demo .m-stats{gap:7px}#merlin-demo .m-stat strong{font-size:23px}#merlin-demo .m-stat{padding:12px 9px}#merlin-demo .m-heading{gap:12px}#merlin-demo .m-layer{padding:35px 10px}#merlin-demo .m-dialog{padding:20px}#merlin-demo .m-demo{padding-right:100px}}
@media(pointer:coarse){#merlin-demo button{min-height:44px}#merlin-demo input,#merlin-demo select{font-size:16px;min-height:44px}}
@media(prefers-reduced-motion:no-preference){#merlin-demo .m-button,#merlin-demo .m-nav button{transition:background .15s}}
</style>
<div id="merlin-demo" aria-label="Interaktiver Merlin-Dashboard-Entwurf">
  <div class="m-demo"><span>Interaktiver Entwurf · Beispieldaten</span><button type="button" data-action="reset">Demo zurücksetzen</button></div>
  <div class="m-shell" id="merlin-shell"></div>
  <div class="m-layer" id="merlin-layer" hidden></div>
  <div class="m-toast" id="merlin-toast" role="status" aria-live="polite"></div>
</div>
<script>
(()=>{
const root=document.getElementById('merlin-demo');
const shell=root.querySelector('#merlin-shell'),layer=root.querySelector('#merlin-layer'),toast=root.querySelector('#merlin-toast');
const seed=()=>({stations:[{id:'s1',name:'Station Musterstadt',code:'MST',city:'Musterstadt',address:'Musterweg 8',profile:'Vollständig'},{id:'s2',name:'Station Beispielort',code:'BSP',city:'Beispielort',address:'Beispielstraße 12',profile:'Öffnungszeiten ergänzen'}],people:[{id:'p1',name:'Kim Muster',role:'Stationsleitung',stations:['s1','s2'],status:'Aktiv'},{id:'p2',name:'Robin Demo',role:'Mitarbeiter',stations:['s1'],status:'Einladung offen'},{id:'p3',name:'Sam Beispiel',role:'Mitarbeiter',stations:['s1','s2'],status:'Aktiv'},{id:'p4',name:'Jamie Muster',role:'Mitarbeiter',stations:['s2'],status:'Aktiv'}],shifts:[{id:'h1',station:'s1',date:'20.10.',start:'06:00',end:'14:00',person:'p1'},{id:'h2',station:'s1',date:'20.10.',start:'14:00',end:'22:00',person:null},{id:'h3',station:'s2',date:'20.10.',start:'06:00',end:'14:00',person:'p4'},{id:'h4',station:'s2',date:'20.10.',start:'14:00',end:'22:00',person:'p3'},{id:'h5',station:'s1',date:'21.10.',start:'06:00',end:'14:00',person:'p2'},{id:'h6',station:'s1',date:'21.10.',start:'14:00',end:'22:00',person:null},{id:'h7',station:'s2',date:'21.10.',start:'06:00',end:'14:00',person:null},{id:'h8',station:'s2',date:'21.10.',start:'14:00',end:'22:00',person:'p4'}],requests:[{id:'r1',person:'p2',stations:['s1'],type:'Urlaub',range:'02.–06.11.2026',days:5,status:'Beantragt'},{id:'r2',person:'p3',stations:['s1','s2'],type:'Wunschfrei',range:'07.11.2026',days:0,status:'Beantragt'},{id:'r3',person:'p4',stations:['s2'],type:'Urlaub',range:'21.–23.12.2026',days:3,status:'Genehmigt'}]});
let data=seed(),state={page:'overview',station:'all',role:'owner',dialog:null,focusAction:null};
const design={radius:14,accent:'#00869a',compact:false};
const pages={overview:['Übersicht','layout-dashboard'],stations:['Stationen','fuel'],team:['Team & Zugänge','users'],shifts:['Schichtplanung','calendar-days'],absences:['Abwesenheiten','calendar-check'],account:['Vertrag & Abrechnung','building-2']};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const badge=(text,kind='')=>`<span class="m-badge ${kind==='warn'?'m-badge-warn':kind==='neutral'?'m-badge-neutral':''}">${esc(text)}</span>`;
const initials=name=>name.split(' ').map(s=>s[0]).slice(0,2).join('');
const person=id=>data.people.find(p=>p.id===id);
const station=id=>data.stations.find(s=>s.id===id);
const scope=()=>data.stations.filter(s=>(state.role==='owner'||s.id==='s1')&&(state.station==='all'||s.id===state.station));
const ids=()=>scope().map(s=>s.id);
const shifts=()=>data.shifts.filter(s=>ids().includes(s.station));
const requests=()=>data.requests.filter(r=>r.stations.some(s=>ids().includes(s)));
const people=()=>data.people.filter(p=>p.stations.some(s=>ids().includes(s)));
const pending=()=>requests().filter(r=>r.status==='Beantragt');
const open=()=>shifts().filter(s=>!s.person);
const button=(text,action,extra='',primary=false)=>`<button type="button" class="m-button ${primary?'m-primary':''}" data-action="${action}" ${extra}>${text}</button>`;
const link=(text,page)=>`<button type="button" class="m-link" data-page="${page}">${text} ${icon('arrow-up-right')}</button>`;
function normalize(){if(state.role==='lead'){state.station='s1';if(state.page==='account')state.page='overview'}if(!pages[state.page])state.page='overview';if(state.station!=='all'&&!station(state.station))state.station='all'}
function save(){const api=window.openai;if(!api?.setWidgetState)return;const snapshot={modelContent:{ansicht:pages[state.page][0],rolle:state.role==='owner'?'Inhaber':'Stationsleitung',station:state.station==='all'?'Alle Stationen':station(state.station)?.name,offenePlaetze:open().length,offeneAntraege:pending().length},privateContent:{page:state.page,station:state.station,role:state.role,assigned:data.shifts.map(h=>[h.id,h.person]),requestStatus:data.requests.map(r=>[r.id,r.status])}};Promise.resolve(api.setWidgetState(snapshot)).catch(()=>{})}
function restore(saved){const s=saved?.privateContent;if(!s||typeof s!=='object')return;state.page=pages[s.page]?s.page:'overview';state.station=typeof s.station==='string'?s.station:'all';state.role=s.role==='lead'?'lead':'owner';if(Array.isArray(s.assigned))for(const pair of s.assigned){if(!Array.isArray(pair))continue;const h=data.shifts.find(x=>x.id===pair[0]),p=person(pair[1]);if(h&&pair[1]===null)h.person=null;else if(h&&p&&p.stations.includes(h.station))h.person=p.id}if(Array.isArray(s.requestStatus))for(const pair of s.requestStatus){if(!Array.isArray(pair))continue;const r=data.requests.find(x=>x.id===pair[0]);if(r&&['Beantragt','Genehmigt','Berücksichtigt','Abgelehnt'].includes(pair[1]))r.status=pair[1]}normalize()}
function notify(text){toast.textContent=text}
function header(title,subtitle,cta=''){return `<div class="m-heading"><div><div class="m-eyebrow">${state.station==='all'?'Dein Partnerkonto':esc(station(state.station)?.code)}</div><h1>${title}</h1><p>${subtitle}</p></div>${cta}</div>`}
function stats(){const values=[[scope().length,scope().length===1?'Station im Blick':'Stationen im Blick','fuel'],[open().length,open().length===1?'Offener Platz · 20.–21. Okt.':'Offene Plätze · 20.–21. Okt.','calendar-days'],[pending().length,'Offene Anträge','inbox']];return `<div class="m-stats">${values.map(([value,label,i])=>`<div class="m-stat"><span class="m-icon">${icon(i)}</span><div><strong class="m-number">${value}</strong><span class="m-muted">${label}</span></div></div>`).join('')}</div>`}
function stationCard(s){const staff=data.people.filter(p=>p.stations.includes(s.id)),slots=data.shifts.filter(h=>h.station===s.id&&!h.person).length;return `<section class="m-station"><div class="m-station-heading"><span class="m-icon">${icon('fuel')}</span><div><h3>${esc(s.name)}</h3><p class="m-muted m-small">${esc(s.city)} · ${esc(s.code)}</p></div></div><div>${badge(s.profile.startsWith('Entwurf')?'Entwurf':'Aktiv',s.profile.startsWith('Entwurf')?'neutral':'')} <span class="m-muted m-small">${esc(s.profile)}</span></div><div class="m-mini-grid"><div>Teamzugänge<strong class="m-number">${staff.length}</strong></div><div>Offene Plätze<strong class="m-number">${slots}</strong></div></div><button type="button" class="m-link" data-action="station-details" data-id="${s.id}">Stationsprofil ansehen ${icon('arrow-right')}</button></section>`}
function shiftRows(){return shifts().filter(h=>h.date==='20.10.').map(h=>`<div class="m-row"><span class="m-avatar">${h.person?esc(initials(person(h.person).name)):icon('user-round-plus')}</span><div class="m-row-main"><strong>${h.start}–${h.end} · ${h.person?esc(person(h.person).name):'Noch unbesetzt'}</strong><span class="m-muted">${esc(station(h.station).name)}</span></div>${h.person?badge('Geplant'):button('Besetzen','assign',`data-id="${h.id}"`)}</div>`).join('')}
function overview(){const invitations=people().filter(p=>p.status!=='Aktiv').length;return `${header('Dein Stationsalltag.<br>Auf einen Blick.','Dienstag, 20. Oktober 2026 · Alles Wichtige für deinen nächsten Schritt.',state.role==='owner'?button(`${icon('plus')} Station anlegen`,'new-station'):button('Schichtplan öffnen','goto-shifts'))}<div class="m-trial"><span class="m-icon">${icon('sparkles')}</span><div><strong>Dein Start mit Merlin</strong><div class="m-muted">Beispielkonto · 30 Tage kostenlos testen</div></div>${state.role==='owner'?link('Partnerkonto ansehen','account'):badge('Stationsansicht')}</div>${stats()}<div class="m-layout"><section class="m-panel"><div class="m-panel-head"><h2>Heute im Einsatz</h2>${link('Schichtplan','shifts')}</div><div class="m-panel-body">${shiftRows()||'<p class="m-empty">Keine geplanten Einsätze.</p>'}</div></section><div class="m-stack"><section class="m-panel"><div class="m-panel-head"><h2>Deine nächsten Aufgaben</h2></div><div class="m-panel-body"><div class="m-row"><div class="m-row-main"><strong>${open().length} ${open().length===1?'offener Schichtplatz':'offene Schichtplätze'}</strong><span class="m-muted">20.–21. Oktober · Besetzung ergänzen</span></div>${link('Planen','shifts')}</div><div class="m-row"><div class="m-row-main"><strong>${pending().length} ${pending().length===1?'Antrag offen':'Anträge offen'}</strong><span class="m-muted">Urlaub und Wunschfrei</span></div>${link('Ansehen','absences')}</div><div class="m-row"><div class="m-row-main"><strong>${invitations} Einladung${invitations===1?'':'en'} offen</strong><span class="m-muted">Persönliche Zugänge</span></div>${link('Team','team')}</div></div></section><div class="m-callout"><strong>Klare Zuständigkeiten.</strong><span>Stationsleitungen sehen ihre zugewiesenen Stationen. Vertrag und Zahlungsdaten bleiben in der zentralen Verwaltung.</span></div></div></div><div class="m-panel-head" style="padding:0"><h2>Deine Stationen</h2>${link('Alle ansehen','stations')}</div><div class="m-station-grid">${scope().map(stationCard).join('')}</div>`}
function stationsPage(){return `${header('Deine Stationen.<br>Zentral organisiert.','Standorte, Zuständigkeiten und Einrichtung im Überblick.',state.role==='owner'?button(`${icon('plus')} Station anlegen`,'new-station'):'')}<div class="m-station-grid">${scope().map(stationCard).join('')}</div><div class="m-callout"><strong>Standortadresse und Rechnungsadresse bleiben getrennt.</strong><span>Eine neue Station erweitert die Zugriffsrechte der Stationsleitung nicht automatisch.</span></div>`}
function teamPage(){return `${header('Dein Team.<br>Klare Zuständigkeiten.','Persönliche Zugänge für die passenden Stationen.',state.role==='owner'?button(`${icon('user-round-plus')} Einladung vorbereiten`,'invite'):'')}<section class="m-panel"><div class="m-table-wrap"><table><thead><tr><th>Person</th><th>Rolle</th><th>Stationen</th><th>Status</th></tr></thead><tbody>${people().map(p=>`<tr><td><div class="m-person"><span class="m-avatar">${esc(initials(p.name))}</span><div><strong>${esc(p.name)}</strong><small>Persönlicher Zugang</small></div></div></td><td>${esc(p.role)}</td><td>${p.stations.filter(s=>ids().includes(s)).map(s=>esc(station(s).code)).join(' · ')}</td><td>${badge(p.status,p.status==='Aktiv'?'':'warn')}</td></tr>`).join('')}</tbody></table></div></section><div class="m-callout"><strong>Benutzerzugang und Personalakte sind getrennt.</strong><span>Eine Einladung vergibt nur die ausdrücklich gewählten Stationsrechte und erzeugt keine Personalakte.</span></div>`}
function shiftsPage(){return `${header('Dein Team.<br>Klar geplant.','20.–21. Oktober 2026 · Planentwurf mit Beispieldaten.')}<div class="m-trial">${badge('Entwurf','neutral')}<span class="m-muted m-small">${open().length} offene Plätze · Veröffentlichung und vollständige Regelprüfung sind nicht Teil dieser Vorschau.</span></div><div class="m-week">${['20.10.','21.10.'].map((date,i)=>`<section class="m-day"><h2>${i?'Mittwoch':'Dienstag'}, ${date}</h2>${shifts().filter(h=>h.date===date).map(h=>`<div class="m-shift" data-open="${!h.person}"><div class="m-shift-top"><span>${esc(station(h.station).name)}</span>${badge(h.person?'Besetzt':'Offen · 1 Platz',h.person?'':'warn')}</div><h3 class="m-number">${h.start}–${h.end} · ${h.start==='06:00'?'Früh':'Spät'}</h3><p class="m-muted m-small">${h.person?esc(person(h.person).name):'Noch niemand zugeordnet'}</p>${button(h.person?'Zuordnung ändern':'Platz besetzen','assign',`data-id="${h.id}"`,!h.person)}</div>`).join('')}</section>`).join('')}</div>`}
function absencesPage(){return `${header('Freie Zeiten.<br>Klar abgestimmt.','Urlaub und Wunschfrei · Nur Anträge im gewählten Stationsumfang.')}<section class="m-panel"><div class="m-table-wrap"><table><thead><tr><th>Person</th><th>Art / Zeitraum</th><th>Status</th><th>Aktion</th></tr></thead><tbody>${requests().map(r=>`<tr><td>${esc(person(r.person).name)}</td><td><strong>${r.type}</strong><div class="m-muted m-small">${r.range}</div></td><td>${badge(r.status,r.status==='Beantragt'?'warn':'')}</td><td>${button('Ansehen','request',`data-id="${r.id}"`)}</td></tr>`).join('')}</tbody></table></div></section><div class="m-callout"><strong>Keine Gesundheitsdaten im allgemeinen Dashboard.</strong><span>Eine Krankmeldung ist kein Genehmigungsantrag. Die Vorschau zeigt ausschließlich Urlaub und Wunschfrei.</span></div>`}
function accountPage(){return `${header('Dein Partnerkonto.','Zentrale Vertragsübersicht · Ausschließlich Beispieldaten.')}<section class="m-panel"><div class="m-panel-head"><h2>Vertrag & Abrechnung</h2>${badge('Kostenlose Testphase')}</div><div class="m-panel-body m-facts"><div class="m-fact"><span>Vertragspartner</span><strong>Beispiel Stationen GmbH</strong></div><div class="m-fact"><span>Rechnungsadresse</span><strong>Musterstraße 12 · Musterstadt</strong></div><div class="m-fact"><span>SEPA-Mandat</span><strong>Erteilt · Beispieldaten</strong></div><div class="m-fact"><span>Preismodell</span><strong>Noch offen</strong></div><div class="m-fact"><span>Stationen in dieser Demo</span><strong>${data.stations.length}</strong></div></div></section><div class="m-callout"><strong>Hier wird kein Abo abgeschlossen.</strong><span>Preise und Verlängerung sind noch zu entscheiden. Es werden weder Bankdaten erfasst noch Zahlungen ausgelöst.</span></div>`}
function render(){normalize();shell.innerHTML=`<aside class="m-side"><div class="m-logo"><span class="m-mark" aria-hidden="true"></span>merlin</div><div class="m-org"><strong>Beispiel Stationen GmbH</strong><span class="m-muted">${state.role==='owner'?'Partnerkonto · Inhaber':'Station Musterstadt · Leitung'}</span></div><nav class="m-nav" aria-label="Hauptnavigation">${Object.entries(pages).filter(([key])=>key!=='account').map(([key,[label,i]])=>`<button type="button" data-page="${key}" ${state.page===key?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('')}</nav>${state.role==='owner'?`<div class="m-side-foot"><nav class="m-nav" aria-label="Partnerverwaltung"><button type="button" data-page="account" ${state.page==='account'?'aria-current="page"':''}>${icon('building-2')}Vertrag & Abrechnung</button></nav></div>`:''}</aside><div class="m-main"><header class="m-top"><label><span class="m-small m-muted">Station</span><select aria-label="Station auswählen" data-control="station">${state.role==='owner'?`<option value="all" ${state.station==='all'?'selected':''}>Alle Stationen</option>`:''}${data.stations.filter(s=>state.role==='owner'||s.id==='s1').map(s=>`<option value="${s.id}" ${state.station===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><div class="m-top-right"><label><span class="m-small m-muted">Demo-Rolle</span><select aria-label="Demo-Rolle auswählen" data-control="role"><option value="owner" ${state.role==='owner'?'selected':''}>Inhaber</option><option value="lead" ${state.role==='lead'?'selected':''}>Stationsleitung</option></select></label><span class="m-avatar">${state.role==='owner'?'AB':'KM'}</span></div></header><main class="m-content">${({overview,stations:stationsPage,team:teamPage,shifts:shiftsPage,absences:absencesPage,account:accountPage}[state.page])()}<footer class="m-footer"><span>Merlin · Gestaltungsentwurf</span><span>Beispieldaten · Änderungen nur in dieser Vorschau</span></footer></main></div>`;if(state.role==='lead'){shell.querySelector('[data-control="station"]').outerHTML='<strong class="m-small">Station Musterstadt</strong>'}renderDialog();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}})}
function renderDialog(){const d=state.dialog;if(!d){layer.hidden=true;layer.innerHTML='';shell.inert=false;return}let title='',body='';
if(d.type==='station-details'){const s=station(d.id);title=s.name;body=`<div class="m-facts"><div class="m-fact"><span>Standort</span><strong>${esc(s.address)} · ${esc(s.city)}</strong></div><div class="m-fact"><span>Status</span>${badge(s.profile.startsWith('Entwurf')?'Entwurf':'Aktiv')}</div><div class="m-fact"><span>Stationsprofil</span><strong>${esc(s.profile)}</strong></div></div><div class="m-actions">${button('Im Schichtplan öffnen','station-shifts',`data-id="${s.id}"`,true)}</div>`}
if(d.type==='new-station'){title='Weitere Station vorbereiten';body=`<form data-form="station"><label class="m-field">Stationsname<input name="name" required maxlength="70" value="Station Süd" autocomplete="off"></label><label class="m-field">Beispielort<select name="city"><option>Musterstadt</option><option>Beispielort</option></select></label><div class="m-callout">Nur als Beispieldatensatz in dieser Vorschau. Es wird keine Station in der echten Anwendung angelegt.</div><div class="m-error" role="alert"></div><div class="m-actions">${button('Abbrechen','close')}<button class="m-button m-primary" type="button" data-submit="true">In Vorschau hinzufügen</button></div></form>`}
if(d.type==='invite'){title='Einladung vorbereiten';body=`<form data-form="invite"><label class="m-field">Beispielname<input name="name" required maxlength="60" value="Taylor Demo" autocomplete="off"></label><label class="m-field">Beispiel-E-Mail<input name="email" type="email" required value="taylor@beispiel.invalid" autocomplete="off"></label><label class="m-field">Station<select name="station">${scope().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><div class="m-callout">Rolle: Mitarbeiter · Nur eine Vormerkung. Es wird keine E-Mail versandt. Bitte ausschließlich eine .invalid-Beispieladresse verwenden.</div><div class="m-error" role="alert"></div><div class="m-actions">${button('Abbrechen','close')}<button class="m-button m-primary" type="button" data-submit="true">Als Demo vormerken</button></div></form>`}
if(d.type==='assign'){const h=data.shifts.find(x=>x.id===d.id);title='Schichtplatz besetzen';body=`<p class="m-muted m-small">${esc(station(h.station).name)} · ${h.date}2026 · ${h.start}–${h.end}</p><form data-form="assign"><label class="m-field">Mitarbeiter<select name="person"><option value="">Platz offen lassen</option>${data.people.filter(p=>p.stations.includes(h.station)).map(p=>`<option value="${p.id}" ${h.person===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div class="m-callout">Die Vorschau prüft zeitliche Überschneidungen in ihren Beispieldaten. Arbeitszeit-, Pausen- und Vertragsprüfungen sind noch nicht umgesetzt.</div><div class="m-error" role="alert"></div><div class="m-actions">${button('Abbrechen','close')}<button class="m-button m-primary" type="button" data-submit="true">Zuordnung übernehmen</button></div></form>`}
if(d.type==='request'){const r=data.requests.find(x=>x.id===d.id);title=`${r.type==='Urlaub'?'Urlaubsantrag':'Wunschfrei'} ansehen`;body=`<div class="m-facts"><div class="m-fact"><span>Person</span><strong>${esc(person(r.person).name)}</strong></div><div class="m-fact"><span>Zeitraum</span><strong>${r.range}</strong></div><div class="m-fact"><span>Status</span>${badge(r.status,r.status==='Beantragt'?'warn':'')}</div>${r.days?`<div class="m-fact"><span>Urlaubstage</span><strong>${r.days} · Beispieldaten</strong></div>`:''}</div><div class="m-callout">${state.role==='owner'?'Hier lässt sich nur der Status im Beispiel ändern. Eine echte Kontoprüfung oder Änderung veröffentlichter Schichten erfolgt nicht.':'In dieser Rollenvariante entscheidet die zentrale Personalverwaltung. Die Stationsleitung kann keine eigene Freigabeberechtigung erzeugen.'}</div><div class="m-actions">${button('Schließen','close')}${state.role==='owner'&&r.status==='Beantragt'?button(r.type==='Urlaub'?'In Demo genehmigen':'In Demo berücksichtigen','approve',`data-id="${r.id}"`,true):''}</div>`}
layer.innerHTML=`<section class="m-dialog" role="dialog" aria-modal="true" aria-labelledby="merlin-dialog-title"><div class="m-dialog-head"><h2 id="merlin-dialog-title">${esc(title)}</h2><button type="button" class="m-button" data-action="close" aria-label="Dialog schließen">×</button></div>${body}</section>`;layer.hidden=false;shell.inert=true;const focus=layer.querySelector('input,select,button');if(focus)focus.focus()}
function close(){const action=state.focusAction;state.dialog=null;render();const target=action?root.querySelector(`[data-action="${action}"]`):root.querySelector('[data-page="'+state.page+'"]');target?.focus()}
root.addEventListener('click',e=>{const target=e.target.closest('button');if(!target||!root.contains(target))return;const page=target.dataset.page;if(page){state.page=page;state.dialog=null;toast.textContent='';render();save();root.querySelector(`[data-page="${page}"]`)?.focus();return}const a=target.dataset.action,id=target.dataset.id;if(!a)return;if(a==='reset'){data=seed();state={page:'overview',station:'all',role:'owner',dialog:null};render();save();notify('Die Beispieldaten wurden zurückgesetzt.');return}if(a==='close'){close();return}if(a==='goto-shifts'){state.page='shifts';render();save();return}if(a==='station-shifts'){state.station=id;state.page='shifts';state.dialog=null;render();save();return}if(a==='approve'){if(state.role!=='owner')return;const r=requests().find(x=>x.id===id);if(!r||r.status!=='Beantragt')return;r.status=r.type==='Urlaub'?'Genehmigt':'Berücksichtigt';state.dialog=null;render();save();notify('Status im Beispiel geändert. Es wurde keine echte Freigabe oder Kontobuchung ausgeführt.');return}if(['station-details','assign','request','new-station','invite'].includes(a)){if(['new-station','invite'].includes(a)&&state.role!=='owner')return;if(a==='station-details'&&!ids().includes(id))return;if(a==='assign'&&!shifts().some(h=>h.id===id))return;if(a==='request'&&!requests().some(r=>r.id===id))return;state.focusAction=a;state.dialog={type:a,id};if(state.role==='lead'){shell.querySelector('[data-control="station"]').outerHTML='<strong class="m-small">Station Musterstadt</strong>'}renderDialog();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}})}});
root.addEventListener('change',e=>{const control=e.target.dataset.control;if(control==='station'){state.station=e.target.value;state.dialog=null;render();save();root.querySelector('[data-control="station"]')?.focus()}if(control==='role'){state.role=e.target.value;state.station=state.role==='lead'?'s1':'all';state.dialog=null;render();save();root.querySelector('[data-control="role"]')?.focus();notify(state.role==='lead'?'Stationsleitungsansicht: nur Musterstadt, ohne Vertrags- und Zahlungsverwaltung.':'Inhaberansicht: alle Beispielstationen.')}});
function submitForm(form){if(!form.reportValidity())return;const values=new FormData(form);const error=form.querySelector('.m-error');const d=state.dialog;if(!d)return;
if(form.dataset.form==='assign'){const h=shifts().find(x=>x.id===d.id);if(!h)return;const value=String(values.get('person')||'');const p=person(value);if(value&&(!p||!p.stations.includes(h.station))){error.textContent='Diese Person gehört nicht zum erlaubten Stationsumfang.';return}const conflict=value&&data.shifts.some(s=>s.id!==h.id&&s.person===value&&s.date===h.date&&s.start<h.end&&s.end>h.start);if(conflict){error.textContent='Zeitliche Überschneidung: Diese Person ist im Beispiel bereits gleichzeitig eingeplant. Bitte eine andere Person wählen.';return}h.person=value||null;close();save();notify('Zuordnung im Planentwurf aktualisiert. Der Plan wurde nicht veröffentlicht.')}
if(form.dataset.form==='station'){if(state.role!=='owner')return;const name=String(values.get('name')||'').trim();if(!name){error.textContent='Bitte einen Stationsnamen eingeben.';return}if(data.stations.some(s=>s.name.toLowerCase()===name.toLowerCase())){error.textContent='Dieser Stationsname ist in der Vorschau bereits vorhanden.';return}const id='s'+(data.stations.length+1);data.stations.push({id,name,code:'NEU',city:String(values.get('city')),address:'Beispielanschrift noch offen',profile:'Entwurf · Stammdaten ergänzen'});state.page='stations';state.station=id;close();notify('Station nur als Beispiel hinzugefügt. Es wurden keine echten Daten gespeichert.')}
if(form.dataset.form==='invite'){if(state.role!=='owner')return;const email=String(values.get('email')||'').trim();if(!/^[^\s@]+@[^\s@]+\.invalid$/i.test(email)){error.textContent='Bitte eine reine Beispieladresse mit der Endung .invalid verwenden.';return}const name=String(values.get('name')||'').trim(),s=String(values.get('station')||'');if(!name||!ids().includes(s)){error.textContent='Bitte Beispielname und erlaubte Station wählen.';return}data.people.push({id:'p'+(data.people.length+1),name,role:'Mitarbeiter',stations:[s],status:'Vorgemerkt'});state.page='team';close();notify('Einladung als Beispiel vorgemerkt. Es wurde keine E-Mail versandt.')}
}
root.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();submitForm(form)});
root.addEventListener('click',e=>{const target=e.target.closest('button[data-submit]');if(target)submitForm(target.closest('form[data-form]'))});
root.addEventListener('keydown',e=>{if(!state.dialog)return;if(e.key==='Escape'){e.preventDefault();close();return}if(e.key==='Enter'&&e.target.matches('input')){e.preventDefault();submitForm(e.target.closest('form[data-form]'));return}if(e.key==='Tab'){const controls=[...layer.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled)')];if(!controls.length)return;const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
restore(window.openai?.widgetState);render();
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);state.dialog=null;render()}});
function applyDesign(){root.style.setProperty('--m-radius',design.radius+'px');root.style.setProperty('--m-accent',design.accent);root.dataset.compact=String(design.compact)}
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:applyDesign});t.addSlider(design,'radius',{label:'Kartenrundung',min:8,max:22,unit:'px'});t.addColorPicker(design,'accent',{label:'Petrol-Akzent',reference:'--m-accent'});t.addToggle(design,'compact',{label:'Kompakte Abstände'})}
applyDesign();
})();
</script>
