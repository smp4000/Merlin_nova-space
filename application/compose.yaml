name: merlin-nova
services:
  mysql:
    image: mysql:9.7.2@sha256:e2fa358a74ac81148e7e27d9433e4c0ab62133de8ea4428b4f39a51a4ba7d07f
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root
    secrets: [mysql_root]
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.local/mysql-init.sql:/docker-entrypoint-initdb.d/01-merlin.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  app:
    image: merlin-nova-php:local
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes: [".:/app"]
    ports: ["127.0.0.1:8000:8000"]
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    depends_on:
      mysql: {condition: service_healthy}
secrets:
  mysql_root:
    file: ./.local/mysql-root
volumes:
  mysql_data:
